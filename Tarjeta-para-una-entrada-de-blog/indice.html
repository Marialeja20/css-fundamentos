<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Blog Post Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="blog-post-card">
    <img class="post-img" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="Imagen de portada del blog">

    <div class="post-content">
      <h2 class="post-title">Mi Primer Proyecto Web</h2>
      <p class="post-excerpt">En este artículo comparto cómo inicié mi camino en el desarrollo web, creando proyectos sencillos con HTML, CSS y JavaScript.</p>
      <a href="#" class="read-more">Read More</a>
    </div>
  </div>
</body>
</html>
