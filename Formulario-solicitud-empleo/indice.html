<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1 class="title center">Job Application Form</h1>
    <p class="description center">Please fill out the form below to apply for a position.</p>
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required placeholder="E.g., Jane Doe">
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required placeholder="E.g., jane@example.com">
      <label for="position">Position:</label>
      <select id="position" name="position" required>
        <option value="">Select a position</option>
        <option value="developer">Developer</option>
        <option value="designer">Designer</option>
        <option value="manager">Project Manager</option>
      </select>
      <fieldset class="radio-group">
        <legend>Availability</legend>
        <input type="radio" id="full-time" name="availability" value="full-time" required>
        <label for="full-time">Full-time</label>
        <input type="radio" id="part-time" name="availability" value="part-time">
        <label for="part-time">Part-time</label>
      </fieldset>
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="4" cols="50" required></textarea>
      <button type="submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
