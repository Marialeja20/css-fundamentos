<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Destino - Mi Producto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header con logo y navegación -->
  <header id="header">
    <img id="header-img" src="https://cdn.freecodecamp.org/testable-projects-fcc/images/product-landing-page-logo.png" alt="Logo del producto">
    <nav id="nav-bar">
      <a href="#features" class="nav-link">Características</a>
      <a href="#video-section" class="nav-link">Video</a>
      <a href="#form-section" class="nav-link">Suscripción</a>
    </nav>
  </header>

  <!-- Sección de características -->
  <section id="features">
    <h2>Características del Producto</h2>
    <p>Este producto ofrece innovación, calidad y soporte continuo para mejorar tu experiencia.</p>
  </section>

  <!-- Sección de video -->
  <section id="video-section">
    <h2>Demostración del Producto</h2>
    <iframe id="video" src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
            title="Video del producto" frameborder="0" allowfullscreen></iframe>
  </section>

  <!-- Sección de formulario -->
  <section id="form-section">
    <h2>Suscríbete para más información</h2>
    <form id="form" action="https://www.freecodecamp.org/email-submit">
      <input type="email" id="email" name="email" placeholder="Introduce tu correo electrónico" required>
      <input type="submit" id="submit" value="Enviar">
    </form>
  </section>
</body>
</html>
